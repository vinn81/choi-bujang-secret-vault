<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a28">
  <title>오프라인 | 최부장 비밀 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 640px; margin: 0 auto; padding: 56px 22px; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    button { border: 0; border-radius: 9px; padding: 11px 18px; background: #8ad8df; color: #10212c; font: inherit; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>지금은 오프라인입니다</h1>
    <p>자료실은 로그인과 서버 검사를 거쳐야 열립니다. 연결이 끊긴 동안에는 메모를 보여 주거나 저장하지 않으며, 이 기기에 메모를 보관해 두지도 않습니다.</p>
    <p>인터넷에 다시 연결한 뒤 새로고침해 주세요.</p>
    <button type="button" onclick="location.reload()">다시 시도</button>
  </main>
</body>
</html>
