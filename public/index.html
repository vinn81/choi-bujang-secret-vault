<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 820px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    h2 { margin: 0; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    .panel { margin: 26px 0; padding: 22px; border: 1px solid #51667c; border-radius: 14px; background: #162538; }
    .panel > p { margin: 8px 0 16px; font-size: 15px; }
    form { display: grid; gap: 14px; }
    label { display: grid; gap: 7px; color: #dce9f7; font-weight: 700; }
    input, textarea { box-sizing: border-box; width: 100%; border: 1px solid #60778f; border-radius: 9px; padding: 12px; background: #0e1926; color: #ecf4ff; font: inherit; }
    textarea { min-height: 130px; resize: vertical; }
    input:focus, textarea:focus { outline: 3px solid #8ad8df55; border-color: #8ad8df; }
    button { width: fit-content; border: 0; border-radius: 9px; padding: 11px 18px; background: #8ad8df; color: #10212c; font: inherit; font-weight: 800; cursor: pointer; }
    button.secondary { border: 1px solid #8ad8df; background: transparent; color: #bcebf0; }
    button.danger { border: 1px solid #d07384; background: transparent; color: #ffbdc8; }
    button:disabled { cursor: wait; opacity: .6; }
    .status { min-height: 1.5em; margin: 14px 0 0; color: #bcebf0; }
    .status.error { color: #ffb7c3; }
    .toolbar, .form-actions, .note-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .form-actions, .note-actions { justify-content: flex-start; }
    .editor { margin: 18px 0; padding: 18px; border: 1px solid #60778f; border-radius: 12px; background: #0f1d2c; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    li strong { display: block; font-size: 18px; margin-bottom: 7px; }
    li .note-body { margin: 0 0 14px; color: #bfd0e5; white-space: pre-wrap; overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 5단계 서버 경유 자료실</div>
    <h1>점령된 자료실</h1>
    <p>서버가 확인한 로그인 사용자 ID로 가상 메모를 저장하고 불러옵니다.</p>
    <div class="notice">메모 읽기·추가·수정·삭제는 서버 함수만 사용하며 로그인과 소유자 검사를 유지합니다.</div>

    <section class="panel" aria-labelledby="auth-heading">
      <h2 id="auth-heading">Supabase Auth 로그인</h2>
      <p>등록된 계정의 이메일과 비밀번호로 로그인합니다.</p>
      <form id="login-form">
        <label>
          이메일
          <input id="email" name="email" type="email" autocomplete="username" required>
        </label>
        <label>
          비밀번호
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <button id="login-button" type="submit">로그인</button>
      </form>
      <div id="signed-in" hidden>
        <p><strong id="account-email"></strong> 계정으로 로그인했습니다.</p>
        <button id="logout-button" class="secondary" type="button">로그아웃</button>
      </div>
      <p id="auth-status" class="status" role="status" aria-live="polite">로그인 설정을 확인하는 중입니다.</p>
    </section>

    <section id="notes-panel" class="panel" aria-labelledby="notes-heading" hidden>
      <div class="toolbar">
        <h2 id="notes-heading">내 가상 메모</h2>
        <button id="new-note-button" type="button">새 메모</button>
      </div>
      <form id="note-form" class="editor" hidden>
        <input id="note-id" type="hidden">
        <label>
          제목
          <input id="note-title" name="title" maxlength="160" required>
        </label>
        <label>
          내용
          <textarea id="note-body" name="body" maxlength="10000" required></textarea>
        </label>
        <div class="form-actions">
          <button id="save-note-button" type="submit">저장</button>
          <button id="cancel-note-button" class="secondary" type="button">취소</button>
        </div>
      </form>
      <p id="notes-status" class="status" role="status" aria-live="polite"></p>
      <ul id="notes" aria-live="polite"><li>가상 메모를 불러오는 중입니다.</li></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
  <script>
    const loginForm = document.querySelector('#login-form');
    const emailInput = document.querySelector('#email');
    const passwordInput = document.querySelector('#password');
    const loginButton = document.querySelector('#login-button');
    const signedInPanel = document.querySelector('#signed-in');
    const accountEmail = document.querySelector('#account-email');
    const logoutButton = document.querySelector('#logout-button');
    const authStatus = document.querySelector('#auth-status');
    const notesPanel = document.querySelector('#notes-panel');
    const newNoteButton = document.querySelector('#new-note-button');
    const noteForm = document.querySelector('#note-form');
    const noteIdInput = document.querySelector('#note-id');
    const noteTitleInput = document.querySelector('#note-title');
    const noteBodyInput = document.querySelector('#note-body');
    const saveNoteButton = document.querySelector('#save-note-button');
    const cancelNoteButton = document.querySelector('#cancel-note-button');
    const notesStatus = document.querySelector('#notes-status');
    const list = document.querySelector('#notes');
    let currentAccessToken = '';
    let notesRequest = 0;

    function setStatus(element, message, isError = false) {
      element.textContent = message;
      element.classList.toggle('error', isError);
    }

    function renderAuthState(session) {
      const signedIn = Boolean(session?.user);
      loginForm.hidden = signedIn;
      signedInPanel.hidden = !signedIn;
      notesPanel.hidden = !signedIn;
      accountEmail.textContent = signedIn ? (session.user.email || '이메일 미확인') : '';
    }

    function setAuthBusy(isBusy) {
      emailInput.disabled = isBusy;
      passwordInput.disabled = isBusy;
      loginButton.disabled = isBusy;
      logoutButton.disabled = isBusy;
    }

    function setNotesBusy(isBusy) {
      notesPanel.querySelectorAll('button, input, textarea').forEach(element => {
        element.disabled = isBusy;
      });
    }

    function resetEditor() {
      noteForm.reset();
      noteIdInput.value = '';
      noteForm.hidden = true;
      saveNoteButton.textContent = '저장';
    }

    function clearNotes(message = '로그인하면 가상 메모를 볼 수 있습니다.') {
      notesRequest += 1;
      const item = document.createElement('li');
      item.textContent = message;
      list.replaceChildren(item);
    }

    function resetSignedOutState() {
      currentAccessToken = '';
      resetEditor();
      setStatus(notesStatus, '');
      clearNotes();
    }

    async function apiRequest(path, { method = 'GET', body } = {}) {
      if (!currentAccessToken) throw new Error('로그인이 필요합니다.');
      const headers = { Authorization: `Bearer ${currentAccessToken}` };
      if (body !== undefined) headers['Content-Type'] = 'application/json';
      const response = await fetch(path, {
        method,
        headers,
        body: body === undefined ? undefined : JSON.stringify(body),
        cache: 'no-store',
      });
      let data = null;
      if (response.status !== 204) {
        try { data = await response.json(); } catch { data = null; }
      }
      if (!response.ok) {
        if (response.status === 401) throw new Error('로그인이 필요하거나 로그인 시간이 끝났습니다.');
        if (response.status === 404) throw new Error('메모를 찾을 수 없습니다.');
        if (response.status === 409) throw new Error('같은 ID의 메모가 이미 있습니다.');
        if (response.status === 400) throw new Error('제목과 내용을 확인하세요.');
        throw new Error('서버가 요청을 처리하지 못했습니다.');
      }
      return data;
    }

    function beginCreate() {
      resetEditor();
      noteForm.hidden = false;
      setStatus(notesStatus, '새 가상 메모를 작성합니다.');
      noteTitleInput.focus();
    }

    function beginEdit(note) {
      noteIdInput.value = note.id;
      noteTitleInput.value = note.title;
      noteBodyInput.value = note.body;
      saveNoteButton.textContent = '수정 저장';
      noteForm.hidden = false;
      setStatus(notesStatus, '가상 메모를 수정합니다.');
      noteTitleInput.focus();
    }

    async function removeNote(note) {
      if (!window.confirm('이 가상 메모를 삭제할까요?')) return;
      setNotesBusy(true);
      setStatus(notesStatus, '삭제하는 중입니다.');
      try {
        await apiRequest(`/api/notes/${encodeURIComponent(note.id)}`, { method: 'DELETE' });
        if (noteIdInput.value === note.id) resetEditor();
        setStatus(notesStatus, '메모를 삭제했습니다.');
        await loadNotes();
      } catch (error) {
        setStatus(notesStatus, `삭제 실패: ${error.message}`, true);
      } finally {
        setNotesBusy(false);
      }
    }

    function renderNotes(notes) {
      if (notes.length === 0) {
        clearNotes('아직 작성한 가상 메모가 없습니다.');
        return;
      }
      list.replaceChildren(...notes.map(note => {
        const item = document.createElement('li');
        const title = document.createElement('strong');
        const body = document.createElement('p');
        const actions = document.createElement('div');
        const editButton = document.createElement('button');
        const deleteButton = document.createElement('button');
        title.textContent = note.title;
        body.className = 'note-body';
        body.textContent = note.body;
        actions.className = 'note-actions';
        editButton.type = 'button';
        editButton.className = 'secondary';
        editButton.textContent = '수정';
        editButton.addEventListener('click', () => beginEdit(note));
        deleteButton.type = 'button';
        deleteButton.className = 'danger';
        deleteButton.textContent = '삭제';
        deleteButton.addEventListener('click', () => void removeNote(note));
        actions.append(editButton, deleteButton);
        item.append(title, body, actions);
        return item;
      }));
    }

    async function loadNotes() {
      if (!currentAccessToken) {
        clearNotes();
        return;
      }
      const requestId = ++notesRequest;
      const loadingItem = document.createElement('li');
      loadingItem.textContent = '가상 메모를 불러오는 중입니다.';
      list.replaceChildren(loadingItem);
      try {
        const data = await apiRequest('/api/notes');
        if (requestId !== notesRequest) return;
        if (!Array.isArray(data?.notes)
            || data.notes.some(note => typeof note?.id !== 'string'
              || typeof note.title !== 'string' || typeof note.body !== 'string')) {
          throw new Error('자료 형식이 맞지 않습니다.');
        }
        renderNotes(data.notes);
      } catch (error) {
        if (requestId !== notesRequest) return;
        clearNotes(error.message);
        setStatus(notesStatus, `목록 불러오기 실패: ${error.message}`, true);
      }
    }

    async function startAuth() {
      if (!window.supabase?.createClient) {
        setAuthBusy(true);
        setStatus(authStatus, 'Supabase 공식 SDK를 불러오지 못했습니다.', true);
        return;
      }

      let authConfig;
      try {
        const response = await fetch('/api/notes?auth=config', {
          headers: { Accept: 'application/json' },
          cache: 'no-store',
        });
        authConfig = await response.json();
        if (!response.ok || typeof authConfig?.supabaseUrl !== 'string'
            || typeof authConfig.publishableKey !== 'string') {
          throw new Error('invalid_auth_config');
        }
      } catch {
        setAuthBusy(true);
        setStatus(authStatus, '서버 로그인 설정을 불러오지 못했습니다.', true);
        return;
      }

      const authClient = window.supabase.createClient(
        authConfig.supabaseUrl,
        authConfig.publishableKey,
      );
      const { data: authListener } = authClient.auth.onAuthStateChange((event, session) => {
        currentAccessToken = session?.access_token || '';
        renderAuthState(session);
        if (currentAccessToken) {
          void loadNotes();
        } else {
          resetSignedOutState();
        }
        if (event === 'INITIAL_SESSION') {
          setStatus(authStatus, session ? '저장된 로그인 상태를 확인했습니다.' : '현재 로그아웃 상태입니다.');
        } else if (event === 'SIGNED_IN') {
          setStatus(authStatus, '로그인했습니다.');
        } else if (event === 'SIGNED_OUT') {
          setStatus(authStatus, '로그아웃했습니다.');
        }
      });

      loginForm.addEventListener('submit', async event => {
        event.preventDefault();
        setAuthBusy(true);
        setStatus(authStatus, '로그인하는 중입니다.');
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        try {
          const { error } = await authClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          loginForm.reset();
          setStatus(authStatus, '로그인했습니다.');
        } catch (error) {
          setStatus(authStatus, `로그인 실패: ${error.message || '이메일과 비밀번호를 확인하세요.'}`, true);
        } finally {
          passwordInput.value = '';
          setAuthBusy(false);
        }
      });

      logoutButton.addEventListener('click', async () => {
        setAuthBusy(true);
        setStatus(authStatus, '로그아웃하는 중입니다.');
        try {
          const { error } = await authClient.auth.signOut({ scope: 'local' });
          if (error) throw error;
          renderAuthState(null);
          resetSignedOutState();
          setStatus(authStatus, '로그아웃했습니다.');
        } catch (error) {
          setStatus(authStatus, `로그아웃 실패: ${error.message || '다시 시도하세요.'}`, true);
        } finally {
          setAuthBusy(false);
        }
      });

      window.addEventListener('pagehide', () => authListener.subscription.unsubscribe(), { once: true });
    }

    newNoteButton.addEventListener('click', beginCreate);
    cancelNoteButton.addEventListener('click', () => {
      resetEditor();
      setStatus(notesStatus, '편집을 취소했습니다.');
    });
    noteForm.addEventListener('submit', async event => {
      event.preventDefault();
      const id = noteIdInput.value;
      const payload = { title: noteTitleInput.value, body: noteBodyInput.value };
      setNotesBusy(true);
      setStatus(notesStatus, id ? '수정하는 중입니다.' : '추가하는 중입니다.');
      try {
        await apiRequest(id ? `/api/notes/${encodeURIComponent(id)}` : '/api/notes', {
          method: id ? 'PUT' : 'POST',
          body: payload,
        });
        resetEditor();
        setStatus(notesStatus, id ? '메모를 수정했습니다.' : '메모를 추가했습니다.');
        await loadNotes();
      } catch (error) {
        setStatus(notesStatus, `${id ? '수정' : '추가'} 실패: ${error.message}`, true);
      } finally {
        setNotesBusy(false);
      }
    });

    void startAuth();
  </script>
</body>
</html>
